[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Explicit package list: setuptools auto-discovery chokes on this flat layout
# (config/ holds yaml, db/ holds migrations, scripts/ uses a sys.path hack,
# frontend/ is not Python). Keep in sync when adding a package.
[tool.setuptools]
packages = ["agents", "alerts", "core", "fixtures", "ingest", "language", "orchestrator", "rag", "tests", "tools"]

[project]
name = "orca"
version = "0.1.0"
description = "Marine ecosystem reasoning with collaborative agents - SIH PS 26176"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Split out because this is the group most likely to fight a Windows install.
# The deterministic core (core/, orchestrator/validate_plan, verifier) runs
# with the base dependencies alone, on purpose: the part judges poke at must
# not be hostage to a GDAL wheel.
geo = [
    "shapely>=2.0",
    "pyproj>=3.6",
    "geopandas>=1.0",
]
gridded = [
    "xarray>=2024.6",
    "zarr>=2.18",
    "netCDF4>=1.7",
    "rioxarray>=0.17",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
# Lets `pytest` work from the repo root without an editable install, which is
# one fewer setup step for a machine that has to work at a venue.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
